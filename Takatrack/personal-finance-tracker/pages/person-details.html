<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <title>Person Details — TakaTrack</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="auth-root" class="hidden"></div>

  <div id="app-shell" class="app-shell hidden">
    <aside id="desktop-sidebar" class="desktop-sidebar"></aside>

    <main class="app-main">
      <div style="margin-bottom:12px;">
        <a id="back-to-people" href="./people.html" style="font-size:0.9rem;font-weight:600;">← Back to People</a>
      </div>

      <header class="top-bar">
        <div>
          <h1 class="page-title" id="person-name-heading">Loading...</h1>
          <p class="page-subtitle" id="person-direction-label"></p>
        </div>
        <span id="person-status-badge" class="badge badge-neutral"></span>
      </header>

      <!-- Outstanding Balance & Breakdown -->
      <section class="card" style="margin-bottom:16px;">
        <div class="kpi-label">Current Outstanding Balance</div>
        <div class="net-flow-value tabular-nums" id="detail-outstanding" style="margin:4px 0 12px;">৳0</div>
        <div class="kpi-grid" style="margin-bottom:10px;">
          <div>
            <div class="kpi-label" id="label-principal">Total Borrowed</div>
            <strong class="tabular-nums" style="font-size:1.1rem;" id="detail-principal">৳0</strong>
          </div>
          <div>
            <div class="kpi-label" id="label-settled">Total Repaid</div>
            <strong class="tabular-nums text-income" style="font-size:1.1rem;" id="detail-settled">৳0</strong>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="detail-progress-fill" style="width:0%;"></div>
        </div>

        <div class="row wrap" style="margin-top:16px;">
          <button type="button" id="btn-add-principal" class="btn btn-secondary" style="flex:1;">+ Borrow More</button>
          <button type="button" id="btn-record-settlement" class="btn btn-primary" style="flex:1;">Record Repayment</button>
        </div>
      </section>

      <!-- Chronological History -->
      <section>
        <div class="section-header">
          <h2 class="section-title">Transaction History</h2>
          <span class="text-muted" style="font-size:0.84rem;" id="detail-count">0 entries</span>
        </div>
        <div id="person-history-root">
          <div class="card"><div class="skeleton"></div></div>
        </div>
      </section>
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Mobile Navigation"></nav>
  </div>

  <!-- Add Loan / Repayment Modal -->
  <div id="person-action-modal" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pam-title">
      <div class="modal-header">
        <h2 class="modal-title" id="pam-title">Record Entry</h2>
        <button type="button" class="btn btn-ghost btn-icon" id="close-pam" aria-label="Close">✕</button>
      </div>
      <form id="pam-form" class="stack-sm" novalidate>
        <div class="form-group">
          <label class="form-label" for="pam-amount">Amount (BDT) *</label>
          <div class="input-with-prefix">
            <span class="input-prefix">৳</span>
            <input id="pam-amount" class="form-input quick-amount-input tabular-nums" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="pam-date">Date</label>
          <input id="pam-date" class="form-input" type="date" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="pam-description">Description (optional)</label>
          <input id="pam-description" class="form-input" type="text" maxlength="300" placeholder="Optional note (e.g. bKash transfer, cash)" />
        </div>
        <p id="pam-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-pam">Cancel</button>
          <button type="submit" id="pam-submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/boot-guard.js"></script>
  <script type="module" src="../js/loans.js"></script>
</body>
</html>
